<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>성곽 도시 걷기 테스트 · Grammar Saga</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171813;color:#fff1cf;font:16px system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
a{color:#ffe398}h1{font-size:1.15rem;margin:0}canvas{display:block;width:100%;height:auto;background:#233027;touch-action:none;image-rendering:pixelated;border-radius:6px}
.controls{display:flex;justify-content:center;gap:7px;margin:8px 0}button{min-width:46px;min-height:42px;touch-action:none;background:#32352b;color:#fff;border:1px solid #74755d;border-radius:6px;font:inherit}
p{margin:6px 0;text-align:center}
</style>
<main>
<header><a href="./">← Grammar Saga</a><h1>성곽 도시 걷기 테스트</h1></header>
<canvas id="city" width="1536" height="1024" aria-label="성곽 도시 지도"></canvas>
<div class="controls" aria-label="이동 조작">
<button data-key="ArrowLeft" aria-label="왼쪽">◀</button><button data-key="ArrowUp" aria-label="위">▲</button><button data-key="ArrowDown" aria-label="아래">▼</button><button data-key="ArrowRight" aria-label="오른쪽">▶</button>
<button id="zoom" aria-pressed="false">확대</button>
</div>
<p id="status" role="status">방향키, WASD 또는 화면 버튼으로 움직이세요.</p>
</main>
<script src="city.js" defer></script>
</html>
